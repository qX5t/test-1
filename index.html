<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXSTYLE PREMIUM - บริการแอปพรีเมียม</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #A7D7C5; /* สีมินิมอลมินต์ */
            --bg-color: #F9FBF9;
            --text-color: #4A4A4A;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 { color: #74B49B; margin-bottom: 10px; }
        p.subtitle { margin-bottom: 40px; color: #888; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            border: 1px solid #f0f0f0;
        }

        .card:hover { transform: translateY(-5px); }

        .app-name { font-size: 1.5rem; font-weight: 600; margin-bottom: 10px; }
        .details { font-size: 0.9rem; color: #777; margin-bottom: 15px; height: 50px; }
        .price { font-size: 1.8rem; font-weight: 600; color: #5C8D89; margin-bottom: 20px; }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover { background-color: #8EBCAD; }

        /* Notification Toast */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            bottom: 30px;
            z-index: 1;
        }

        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <h1>NXSTYLE PREMIUM</h1>
    <p class="subtitle">แอปแท้ ราคาประหยัด พร้อมดูแลตลอดการใช้งาน</p>

    <div class="container">
        <div class="card">
            <div class="app-name">YouTube Premium</div>
            <div class="details">ไม่มีโฆษณาคั่น / ฟังเพลงตอนปิดจอได้</div>
            <div class="price">39.- / เดือน</div>
            <button onclick="orderApp('YouTube Premium', '39.-')">คัดลอกและไปสั่งซื้อ</button>
        </div>

        <div class="card">
            <div class="app-name">Netflix UHD</div>
            <div class="details">ความละเอียด 4K / จอส่วนตัว ล็อครหัสได้</div>
            <div class="price">99.- / เดือน</div>
            <button onclick="orderApp('Netflix UHD', '99.-')">คัดลอกและไปสั่งซื้อ</button>
        </div>

        <div class="card">
            <div class="app-name">Disney+ Hotstar</div>
            <div class="details">ดูซีรีส์ Marvel และ Disney ได้ไม่อั้น</div>
            <div class="price">49.- / เดือน</div>
            <button onclick="orderApp('Disney+ Hotstar', '49.-')">คัดลอกและไปสั่งซื้อ</button>
        </div>
    </div>

    <div id="toast">คัดลอกข้อมูลเรียบร้อย! กำลังไปที่ LINE...</div>

    <script>
        function orderApp(name, price) {
            const textToCopy = "สนใจสั่งซื้อ: " + name + "\nราคา: " + price + "\nจากเว็บ NXSTYLE";
            
            // คัดลอกข้อความ
            navigator.clipboard.writeText(textToCopy).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                
                // หลังจาก 1.5 วินาที ให้ลิ้งไปที่ Line
                setTimeout(() => {
                    window.location.href = "https://line.me/ti/p/~nxstyle";
                }, 1500);
            });
        }
    </script>

</body>
</html>
